name: Publish Check

on:
  pull_request:
    paths:
      - "packages/**"
      - ".changeset/**"
      - "pnpm-lock.yaml"

jobs:
  publish-check:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build packages
        run: nx run-many -t build --projects=router-utils,router-core,router,adapter-express,adapter-fastify,adapter-node,router-generator,router-cli,router-client,create-taserjs

      - name: Test JSR publish (dry run)
        run: deno publish --dry-run

      - name: Test npm publish (dry run)
        run: pnpm -r publish --dry-run --no-git-checks